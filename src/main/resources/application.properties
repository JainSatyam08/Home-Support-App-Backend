spring.application.name=homesupportbackend

server.port=${PORT:8080}

logging.level.org.springframework.boot.context.config=DEBUG


# JWT
jwt.secret=${JWT_SECRET:HomeSupportSuperSecretKeyForJwtAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:3600000}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homesupport_android}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devloper}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.zaxxer.hikari=DEBUG